# Visual baselines come only from CI (04 §11.4): this manual workflow regenerates them in the pinned
# Playwright image and uploads the PNGs as an artifact to review and commit.
# (Pushing directly needs a GitHub App token, since GITHUB_TOKEN pushes do not trigger CI.)
name: update-snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  HF_SCOPE: m0
  HF_BASE: /motherload/

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test -c tests/e2e/playwright.ci.config.ts --project=iphone-se --project=iphone-15 --update-snapshots
        env:
          HOME: /root
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots
          path: tests/e2e/**/*-snapshots/
          if-no-files-found: warn
