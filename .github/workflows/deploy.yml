# Deploy (04 §9.4, §12.1): publishes the SAME dist/ that CI built and tested on master to GitHub Pages
# (source: GitHub Actions; no gh-pages branch). A manual run rebuilds from the selected ref instead.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  HF_SCOPE: m0
  HF_BASE: /motherload/
  VITE_CHANNEL: prod

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download the CI-tested dist
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci && npm run build

      - id: pages
        uses: actions/configure-pages@v5

      - name: Keep the previous 2 releases' hashed assets (04 §9.4)
        run: node scripts/pages-retention.mjs dist "${{ steps.pages.outputs.base_url }}" "${{ github.event.workflow_run.head_sha || github.sha }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
