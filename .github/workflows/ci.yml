# CI (04 §12.1): typecheck, purity, unit tests, ONE build (uploaded as the `dist` artifact that deploy.yml
# publishes unchanged), then Playwright e2e against `vite preview` of that artifact in the pinned image.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  # Milestone scope baked into the build (canon §5.5 ledger). Bump to mvp when M0 exits.
  HF_SCOPE: m0
  HF_BASE: /motherload/
  VITE_CHANNEL: prod

jobs:
  check:
    name: typecheck · purity · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run purity
      - run: npx vitest run

  build:
    name: build (once)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Payload report (canon §3.14 initial JS ≤ 350 KB br / 430 KB gzip)
        run: node scripts/size-report.mjs dist >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: e2e (Chromium + SwiftShader)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Playwright (iPhone SE, iPhone 15)
        run: npx playwright test -c tests/e2e/playwright.ci.config.ts --project=iphone-se --project=iphone-15
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          retention-days: 7

  webkit-smoke:
    name: webkit-smoke (DOM only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 04 §11.5: required from M0. Non-blocking until it has been green once on this pipeline.
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright test -c tests/e2e/playwright.ci.config.ts --project=webkit-smoke
        env:
          HOME: /root
