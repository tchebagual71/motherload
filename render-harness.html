<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>HoleFactory render harness</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2b1e2f; }
      #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #hud {
        position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px;
        background: rgba(43, 30, 47, 0.72); color: #f6ead7; font: 600 11px/1.35 ui-monospace, monospace;
        pointer-events: none; white-space: pre;
      }
      #hud.hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/render/harness.ts"></script>
  </body>
</html>
