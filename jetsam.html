<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>HoleFactory jetsam probe</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 24px; background: #2b1e2f; color: #f6ead7; font: 16px/1.45 system-ui, sans-serif; }
      main { max-width: 34rem; margin: 0 auto; }
      h1 { font-size: 20px; margin: 8px 0 4px; }
      p { color: #d9c9b6; margin: 4px 0 12px; }
      button { display: block; width: 100%; min-height: 48px; margin: 8px 0; border: 0; border-radius: 12px; background: #fff6e9; color: #2b1e2f; font: 600 16px system-ui, sans-serif; }
      button:disabled { opacity: 0.5; }
      button.ghost { background: transparent; color: #f6ead7; border: 1.5px solid rgba(246, 234, 215, 0.5); }
      ul { padding-left: 18px; }
      li { margin: 8px 0; }
      #status { min-height: 1.5em; font-variant-numeric: tabular-nums; color: #ffb238; }
    </style>
  </head>
  <body>
    <main id="jetsam">
      <h1>Jetsam probe</h1>
      <p>Allocates memory in 10&nbsp;MB steps until iOS closes the tab. Reopen this page afterwards: the last logged total is the kill point. Run each mode 3 times; the median goes into the Perf Report.</p>
      <button type="button" data-mode="arraybuffer">Run ArrayBuffer probe</button>
      <button type="button" data-mode="webgl">Run WebGL texture probe</button>
      <p id="status" aria-live="polite"></p>
      <ul id="results"></ul>
      <button type="button" class="ghost" id="reset">Clear results</button>
    </main>
    <script type="module" src="/src/debug/jetsamPage.ts"></script>
  </body>
</html>
