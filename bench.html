<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>HoleFactory factory bench</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #2b1e2f; color: #f6ead7; font: 15px/1.45 system-ui, sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      main {
        position: relative; box-sizing: border-box; max-width: 34rem; margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      }
      .card { background: rgba(43, 30, 47, 0.86); border-radius: 14px; padding: 12px 14px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { margin: 4px 0 8px; color: #d9c9b6; }
      #status { min-height: 1.5em; color: #ffb238; font-variant-numeric: tabular-nums; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
      th { text-align: left; vertical-align: top; padding: 4px 8px 4px 0; color: #d9c9b6; font-weight: 600; white-space: nowrap; }
      td { padding: 4px 0; overflow-wrap: anywhere; }
      textarea {
        box-sizing: border-box; width: 100%; height: 88px; margin: 8px 0; border: 0; border-radius: 10px; padding: 8px;
        background: #fff6e9; color: #2b1e2f; font: 12px/1.3 ui-monospace, monospace; resize: vertical;
      }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1; min-height: 48px; border: 0; border-radius: 12px; background: #fff6e9; color: #2b1e2f;
        font: 600 16px system-ui, sans-serif;
      }
      button.ghost { background: transparent; color: #f6ead7; border: 1.5px solid rgba(246, 234, 215, 0.5); }
      /* While it runs the card stays small so the live scene shows; the explanation comes back with the results. */
      body:not(.done) #intro { display: none; }
      body:not(.done) .card { background: rgba(43, 30, 47, 0.7); }
      body:not(.done) #status { margin: 0; }
      h1 small { font-size: 13px; font-weight: 600; color: #d9c9b6; margin-left: 6px; }
      /* Phones: each result's label above its value. */
      @media (max-width: 480px) {
        #results tr { display: block; padding: 4px 0; }
        #results th, #results td { display: block; padding: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <main>
      <div class="card">
        <h1>Factory bench<small>ADR-0002</small></h1>
        <p id="intro">2,000+ buildings and about 10,000 items, built through factory commands in a live World and timed over 6,000 factory ticks while the game renders. For a device run: unplugged, battery above 50%, Low Power Mode off; paste the code back.</p>
        <p id="status" aria-live="polite">Starting…</p>
        <div id="out" hidden>
          <table id="results"></table>
          <textarea id="code" readonly aria-label="Bench result code"></textarea>
          <div class="row">
            <button type="button" id="copy">Copy code</button>
            <button type="button" class="ghost" id="again">Run again</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/debug/benchPage.ts"></script>
  </body>
</html>
